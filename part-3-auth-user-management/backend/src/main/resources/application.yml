server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kido_auth}
    username: ${DB_USER:postgres}
    password: "admin"
  jpa:
    hibernate:
      ddl-auto: update # Local assessment demo only; use migrations in production
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
app:
  jwt-secret: ${JWT_SECRET:}
  demo-admin-password: ${DEMO_ADMIN_PASSWORD:}
  demo-user-password: ${DEMO_USER_PASSWORD:}
